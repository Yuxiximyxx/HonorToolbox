name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.8.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.8.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: 荣耀工具箱 1.8.0
          body: |
            ## 荣耀工具箱 1.8.0（新合入：输入法玻璃 MOS液态输入）

            微信输入法是小乐的主力输入法，他看中了
            superboyyy（酷安@熠寻）的 MOS液态输入：
            给微信/豆包输入法的键盘换上系统自带玻璃
            材质，MagicOS 11 上是液态玻璃全套。本版
            把它合进工具箱「应用」页（按宿主归类，
            与掌盟、小黑盒同页），原仓库不动。

            ### 合入方式

            - 本体零改：玻璃逻辑（Main，2694 行反射+
              荣耀系统玻璃 API）整树搬入，只动入口、
              配置、hook 注册三处适配；
            - 底座对齐：原模块是 libxposed 现代 API，
              适配层把它的 before/after 链式 hook 译
              成传统 XC_MethodHook（原方法由框架直通，
              不经手写 proceed——v1.7.1–v1.7.3 的三
              连坑不重踩）；作用域 15 → 17（新增微信
              输入法、豆包输入法）；
            - 配置换轨：LSPosed 远程配置改为工具箱
              ContentProvider 直供（镜像偏好为权威，
              hook 端拉快照现读、键盘呼出时节流重
              拉）；原独立版的远程配置不迁移，新装
              即默认；
            - 设置进「应用」页 →「输入法玻璃」子页：
              原设置页在 MagicOS 上起作用的项全量摆
              齐（总开关/两输入法分别开关/风格三预
              设/常用/高级五组），数值项用 miuix
              Slider 等效调节；「重启输入法」改为
              root 强停两个输入法（等效原版的进程
              自杀重启）；
            - 总开关关闭时不装任何 hook（与其它合
              入功能同口径，Application.onCreate 后
              经快照门控）；
            - 关于页来源名单加 MOS液态输入一行，
              归属与 Apache-2.0 声明见仓内 NOTICE。

            ### 已知差异（与独立版比）

            - 设置改动在下次呼出键盘时生效（原版远
              程配置是推送实时生效），或点子页里的
              「重启输入法」立即生效；
            - adb 调试属性 debug.wglass.* 保留可用。

            **装后须知**：在 LSPosed 里给工具箱新勾
            微信输入法（和/或豆包输入法）作用域，强
            停输入法后呼出键盘即为液态玻璃；此前装
            过独立版 MOS液态输入的请先停用，避免
            双重 hook。

            **复验点**：① 呼出微信输入法键盘为液态
            玻璃；② 在工具箱子页改模糊/圆角等参数，
            重启输入法或重新呼出键盘后生效；③ 总
            开关关闭后强停输入法，键盘恢复原样。

          files: dist/*.apk
