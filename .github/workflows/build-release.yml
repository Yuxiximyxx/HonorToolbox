name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: 荣耀工具箱 1.6.1
          body: |
            ## 荣耀工具箱 1.6.1（选择器手动输入 + 掌盟名单修复 + 底部留白巡检）

            三项分列（均为设置侧/记录侧改动，各功能 hook 行为
            与配置格式不变）：

            **一、目标选择器补手动输入（快服务手势改向）**
            - **「选择启动方式」页新增「手动输入」**：包名 +
              活动类名（全名）两个输入框，填完保存即按指定
              activity 模式落盘，与列表点选写出的结果完全
              一致。保存前做软校验：包名对应的应用不存在、
              或类名不在该应用已声明的活动里、或活动未导出
              时，只给明确提示、点「仍要保存」即可强制保存
              （清单里查不到不等于不能启动，不硬拦）；类名
              为空不许保存。类名写 ".Foo" 或裸名会自动按
              包名补全。
            - **活动列表加搜索框**：活动列表按 GET_ACTIVITIES
              全量枚举所选应用已声明的全部活动（已导出与未
              导出都列、未导出的标明「未导出，可能打不开」），
              以前上百个活动只能靠翻，现在可直接按类名搜。
            - 起因：荣耀搜索首页
              com.hihonor.search.feature.mainpage.presentation.page.HomeActivity
              只挂 ACTION_VIEW 深链入口（honorsearch://）、
              无 LAUNCHER 入口，在长列表里翻不到——现在可在
              列表里搜 HomeActivity 点选，或手动输入全名直达。

            **二、掌盟底栏逐项名单发现不全修复**
            - 根因：v1.6.0 以「标签」（可见文字→描述）为底栏
              项的唯一身份，文字与描述皆空的纯图标项标签为空，
              记录时被过滤、套用时被跳过——五项底栏只记到
              「首页/我的/加号」三项，另两项永远进不了名单。
            - 改稳定身份制：资源 id 条目名 → 可见文字 →
              contentDescription → 兜底「位置 N」，同名追加
              序号去重；发现与精简总闸解耦，处理到底栏就把
              全部子项记下来。设置页按记录全量列出，缺省
              沿用原口径（首页/我的显示、其余含新发现两项与
              加号隐藏）。
            - 键兼容：逐项开关键改用新身份，读值带旧键回退
              （先新键、没有再读 v1.6.0 的 tab_show_<旧标签>），
              已调过的三项设置不失效，写一次即完成迁移。

            **三、底部留白巡检（悬浮底栏遮挡）**
            - 长按唤醒「选择可唤起的应用」页的保存按钮原来
              只有 16dp 底距、是固定底区，被悬浮底栏压住
              一半（截图实证）——已按宿主既有公式补
              bottomInset（栏高+间隙+呼吸+导航条 inset），
              按钮完整露在底栏上方。
            - 全量巡检结论：快服务三页（主页/选应用/选
              启动方式）、通知中心主题全部子页、日夜图标页、
              掌盟子页、资源库页、四栏主页的列表末项/底部
              区原本就都带了同一留白，无问题；「关于」页是
              整页替换、悬浮栏不渲染，不受影响。

            本版未经真机验证，请按需回验：① 快服务手势改向
            里选荣耀搜索 → 手动输入
            com.hihonor.search 与上述 HomeActivity 全名保存
            → 回桌面从底角斜上滑，应直达荣耀搜索主页；
            ② 活动列表搜索 HomeActivity 能直接找到并点选；
            ③ 故意填一个不存在的类名，应先弹提示、点「仍要
            保存」后能存下；类名留空点保存应被拦；④ 覆盖
            安装后打开一次掌盟 → 掌盟子页逐项开关应出现
            全部五项，逐项开关新出现的两项、底栏均匀分布
            复验；⑤ 长按唤醒的选应用页保存按钮应完整露出
            在悬浮底栏上方、可点。

          files: dist/*.apk
