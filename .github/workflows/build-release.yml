name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.4-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.4-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.4
          name: 荣耀工具箱 1.6.4
          body: |
            ## 荣耀工具箱 1.6.4（修两条配置通道：长按唤醒读旧配置 / 快服务读不到配置）

            两条根因都由小乐导出的 LSPosed 日志实证，只修
            这两条，其余功能（掌盟等）一律未动。

            **一、长按导航条唤醒：hook 一直读 11-21 的旧配置**
            设置侧经 MediaStore 写 navwake.txt 时，删除旧
            文件的步骤实际没删掉（相对路径等值查不中、精确
            文件名也匹配不到改名副本），每写一次就多一份
            「navwake (n).txt」（真机已堆到 (7)），正本停在
            旧内容（总开关开着、但默认目标与已选应用为空）；
            而 hook 侧只读正本，于是每次长按都判「没目标、
            放行」继续唤 YOYO。本版双修：
            - 写侧：删除步改成真删——先查出目录下全部同名
              候选（含 (n) 副本）逐个删除，再写新的一份，
              副本不再堆积、正本即最新；
            - 读侧：候选口径与仓内其余落盘通道对齐——扫
              目录下全部 navwake (n).txt、取修改时间最新
              一份解析，存量副本里的最新配置也能被读到。

            **二、快服务手势改向：hook 在快服务进程里读不到配置**
            配置文件本身存在且内容正确，但快服务进程没有
            直读 /sdcard/Download 的权限，hook 侧目录扫描
            拿不到任何候选（同一文件在系统界面进程里可
            读），安装行与每次斜滑命中都只能报「配置读不
            到、放行」。本版给 hook 侧加一条不需要存储权
            限的通道（与耳机功能的 Settings.Global 跨进程
            桥同模式）：
            - 设置侧每次文件写成功后，把同一份配置同步
              写入 Settings.Global 键
              honortoolbox_quickgesture_config（同步失败
              只留痕、不影响文件通道结果）；
            - hook 侧先读该键、解析成功就用，读不到再
              回退原来的文件候选扫描；判定逻辑零改动；
            - 安装行与命中行日志带上配置来源
              （global/file/none），下轮可直接分辨。

            **复验点**：① 长按唤醒：改一次目标保存 → 用
            首页「重启系统界面」→ 长按导航条应直达所选
            应用；② 快服务改向：保存配置 → 强停快服务
            → 底角斜滑应直达荣耀搜索主页；③ 若仍不行，
            把 LSPosed 日志再导一份：长按唤醒安装行应显
            示默认目标已设、快服务安装行应带
            source=global。

          files: dist/*.apk
