name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.0.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.0.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 荣耀工具箱 1.0.0
          body: |
            ## 荣耀工具箱 1.0.0（第一阶段）

            把原先分散的几个荣耀 LSPosed 小模块合成一个：设置按使用场景分组，
            全部功能可以单独开关，关掉后对应系统行为与没装一样。

            本版包含 4 个功能：
            - 手势与唤醒：快服务手势改向（底角斜滑改为打开自选应用）、
              长按导航条唤醒（长按导航条改为打开自选应用，另含单击导航条返回）
            - 通知中心：通知中心主题（渲染锁屏主题时钟样式、运营商文字隐藏等）
            - 桌面：图标日夜切换（桌面图标随深浅色模式切换主题图标版本）

            资源库增强与两个耳机功能（Free4 / XM4）将在第二阶段合入，
            设置里已留好分组位置。

            ⚠️ 安装前请注意：
            1. 装本模块后，请在 LSPosed 里**停用或卸载旧的同名模块**
               （通知中心主题、快服务手势改向、长按导航条唤醒、图标日夜切换），
               避免双重 hook；
            2. LSPosed 作用域只勾「荣耀工具箱」一个模块的全部作用域；
            3. 各功能的旧配置不会自动迁移，需要在工具箱里重新设置一遍
               （配置统一落在 Download/HonorToolbox/ 目录）。
          files: dist/*.apk
