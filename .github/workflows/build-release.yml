name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.8.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.8.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.1
          name: 荣耀工具箱 1.8.1
          body: |
            ## 荣耀工具箱 1.8.1（两项修：弹窗防遮挡 + 候选栏对齐）

            ### 一、弹窗被悬浮底栏遮挡（全应用巡检）

            miuix SuperDialog 在手机上是底部对齐呈现，
            默认底部边距只有 12dp，悬浮玻璃底栏在合成
            顺序上压在弹窗之上，按钮行会被盖住（真机
            实证：输入法玻璃子页的「恢复默认设置」弹窗）。
            全应用巡检后共 7 处同类弹窗统一修：只给弹窗
            自身加底部 margin（= 各页滚动留白同口径的
            底栏净空 + 12dp），弹窗整体上移；页面、底
            栏与 v1.7.3 定版的一级页沉浸一律不动，底部
            不加任何实色带。悬浮底栏关闭时 margin 回到
            默认 12dp、无变化。

            受影响已修（7 处）：输入法玻璃的恢复默认
            确认与底色输入弹窗、小黑盒增强的文本编辑
            与选项弹窗、资源库的重启作用域确认、自定义
            分类的改名与删除分类确认。不受影响未动：
            耳机详情页的 WindowDialog 是真窗口弹窗，
            本就不在底栏合成链里。

            ### 二、候选栏圆角与位置（微信输入法）

            现状定位：候选高亮块的圆角矩形是微信自绘
            候选栏在自己画布里画的，本体在画布拦截里
            一直把它和按键一视同仁——圆角改写成「按键
            圆角」（默认 8dp），而键盘面板圆角是 22dp，
            两者对不上；位置上高亮块画在候选条 x=0，
            本体原有的左上内收只管拼音行、明确不含候
            选行，所以候选条贴在屏幕左缘。

            改法（只动候选条这一处，其它玻璃逻辑零改）：
            - 圆角：候选条（微信那条又矮的自绘条）里
              的圆角矩形改按键盘面板圆角改写（受块高
              一半封顶），和面板一致；
            - 位置：候选条整条平移，平移量 = 与拼音行
              同一个对齐基点（面板圆角内收量）+ 新增的
              水平偏移；新设置项「候选栏水平偏移」
              （-20dp～+40dp，0 = 左缘与键盘面板对齐，
              默认 +4dp = 对齐后略右移），在「输入法
              玻璃」子页的「高级 · 拼音行位置」组里，
              经原 Provider 通道下次呼出键盘生效，恢复
              默认包含该键。豆包候选是真实文本视图、
              本就不贴边，未动。

            **复验点**：① 打开任意一个上述弹窗，按钮
            应完整露在悬浮底栏上方，页面底部没有多出
            实色带；② 呼出微信输入法打字，候选栏高亮
            块圆角应与键盘面板一致、左缘对齐且略右移；
            ③ 在子页拖「候选栏水平偏移」后重新呼出键
            盘，候选栏应能继续左右移动。

          files: dist/*.apk
