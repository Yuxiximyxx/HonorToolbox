name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.2.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.2.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: 荣耀工具箱 1.2.2
          body: |
            ## 荣耀工具箱 1.2.2（三项修复）

            功能、设置项、默认值与生效方式一概不变，覆盖
            安装即可、配置不用重设。

            **修「模块未激活」误报 + 大卡可点跳 LSPosed**
            - 上一版作用域声明漏了工具箱自身包名，LSPosed
              不把模块注入工具箱自己的进程，激活自检永远
              命中不了——模块明明在工作却报未激活。本版已
              补上，大卡状态恢复真值。
            - 首页状态大卡现在整卡可点，点一下直接打开
              LSPosed 管理器。

            **首页加「本机信息」卡**
            - 机型（营销名优先）、系统版本完整串、Android
              版本与 API 级别、内核版本完整串，全部真读
              系统值，与系统「关于手机」逐项对得上。原小
              卡改为工具箱版本，不再两处写同一信息。

            **悬浮底栏换三家同款液态玻璃**
            - 自绘模糊方案废弃，换成泥坛/贴吧/酷安三家
              fork 在用的 Kyant backdrop 真采样玻璃：饱和
              →模糊→透镜折射→边缘高光，叠纱是三家默认的
              磨砂档。宽度（栏数×88dp、封顶屏宽−32dp）、
              68dp 高、选中深色药丸、玻璃关变实色、悬浮
              关变贴底栏，行为都不变。

            ⚠️ 从旧版升级直接覆盖安装即可，配置不用重设。
            装好后请在 LSPosed 里确认工具箱作用域包含它
            自己（新装/首次升级会多出这一项，勾上并重启
            一次工具箱即可）。

          files: dist/*.apk
