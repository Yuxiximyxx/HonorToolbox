name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.2.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.2.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 荣耀工具箱 1.2.0
          body: |
            ## 荣耀工具箱 1.2.0（界面架构重做）

            本版按反馈重做了设置应用的信息架构，功能、设置项、
            默认值与生效方式一概不变，覆盖安装即可、配置不用
            重设。

            **底栏四栏：首页 / 系统 / 应用 / 设置**
            - 首页改为纯状态总览（已启用功能数、机型、系统、
              版本）+「重启作用域」四行直接列在页内，点行就
              执行；右上角的重启按钮和弹窗撤除，全应用只剩
              首页这一处重启入口。
            - 现在的全部功能只在「系统」页出现一次，按手势与
              唤醒 / 通知中心 / 桌面 / 耳机分组，每行带总开关、
              点行进各自的设置页；首页不再重复列功能。
            - 「应用」页是占位，留给以后非荣耀系统的应用模块；
              「设置」页放软件主题（跟随系统/浅色/深色）、悬浮
              底栏开关、玻璃质感开关和关于。

            **底栏玻璃做实**
            - 悬浮底栏真正压在滚动内容之上，内容能从栏下滚
              过并透出毛玻璃（背景模糊是真的，不是实色贴
              图），选中项带药丸高亮；日夜模式都成立。
            - 不喜欢悬浮或玻璃，去「设置」页关掉即可：关悬浮
              后底栏贴底，关玻璃后底栏变实色。

            ⚠️ 从旧版升级直接覆盖安装即可，配置不用重设。

          files: dist/*.apk
