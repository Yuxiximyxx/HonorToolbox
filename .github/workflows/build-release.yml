name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.10.3-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.10.3-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.3
          name: 荣耀工具箱 1.10.3
          body: |
            ## 荣耀工具箱 1.10.3（修快服务改向闲置后首击偶发失效）

            ### 本版改动（只动 QuickGesture 配置读取，其余功能未动）

            现象：闲置一段时间后第一次从屏幕底角斜上滑，
            仍偶发不跳目标应用、直接打开快服务本身，过一
            会儿又自愈。

            定案（用户导出 quickgesture.log 逐行分析）：快
            服务进程实例呈双稳态——约半数实例从启动起，
            工具箱 ContentProvider 每次读取都立即抛
            IllegalArgumentException，预热、决策点多枪重试、
            onResume 二审全灭且该实例终身不恢复；另一半
            实例首次读取即成功、之后一切正常。v1.10.1 的
            预热提前与重试加码都按设计执行了，但通道可用
            性是进程实例级的二值状态，不是时序问题，重试
            路线到此为止。

            修法：决策不再依赖实时 Provider 读取——

            - 新增宿主本地缓存：hook 在快服务进程内用宿
              主 Context，把每次成功读到的配置顺手写入
              快服务自己的私有存储；宿主读自己的私有存
              储永远可用，不受 Provider 双稳态影响。
            - 读取顺序：各读取点先按现逻辑读 Provider
              （保留现有短重试），全失败且本地缓存存在
              时用缓存配置照常走完决策（日志记 config
              from local cache）；进程启动预热阶段读到
              缓存即灌进进程内缓存，后续手势直接命中。
            - Provider 读取失败的日志改记异常全文（类
              名 + message），为下一轮取证留证据。

            配置语义、默认值、设置界面与改向行为不变；
            缓存只存配置本身。MagicPods 等其他组件一行
            未动。

            **复验点**：装 v1.10.3 后先正常斜滑一次（让
            缓存落盘），再强停快服务、放置一段时间让进
            程被回收，第一次底角斜滑应直接跳目标应用、
            不再先进快服务本身；正常点开快服务图标仍应
            放行。
          files: dist/*.apk
