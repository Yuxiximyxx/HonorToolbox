name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.3-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.3-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: 荣耀工具箱 1.6.3
          body: |
            ## 荣耀工具箱 1.6.3（作用域页隐藏无效行 + 全应用沉浸补齐）

            **一、全部作用域页隐藏无效行（小乐点名）**
            首页「全部作用域」页里，
            - 未安装的宿主行（如 com.hihonor.systemui）
            - 标注「仅探针模式」的宿主行（如
              com.hihonor.magicvoice、com.hihonor.brain）
            直接不显示；分组与「全选本组」的计数也随之不含
            这些行，整组无行时整组不显示。已安装且正常功能
            的宿主行、分组结构、勾选与重启逻辑一律未动。

            **二、系统导航条沉浸补齐（小乐真机反馈）**
            现象：首页与各子页手势条区域是一条不透明黑带、
            内容没延伸到导航条之下。全应用窗口审计结论：
            - MainActivity（首页与全部子页都在它里面）：
              v1.2.3 已有 enableEdgeToEdge + 透明栏色，唯独
              没关系统「对比度强制」——强制开着时系统会在
              手势条区域压一条黑带。本版补上
              isNavigationBarContrastEnforced /
              isStatusBarContrastEnforced = false。
            - 两副耳机的详情页（独立 Activity）：原先根本
              没开 edge-to-edge，导航条还写实色（Free4 页
              按主题写黑/浅灰、XM4 页写死黑色）。本版统一
              改为内容铺到物理底边 + 导航条全透明 + 关
              对比度强制，页面背景延伸到手势条之下。
            - 长按唤醒的选择框（ChooserActivity）：主题
              本就是透明栏，只补关对比度强制，与全应用
              口径统一。

            其余功能、hook、配置均未改动。

            **复验点**：① 打开首页 →「全部作用域」，手势与
            唤醒组应只剩荣耀快服务、系统用户界面两行，其余
            分组行数不变、勾选与「重启选中」照常可用；
            ② 首页、子页与两副耳机详情页底部，手势条区域
            应能看到页面内容/背景延伸下去，不再有不透明
            黑带。

          files: dist/*.apk
