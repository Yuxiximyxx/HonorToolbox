name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.6-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.6-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.6
          name: 荣耀工具箱 1.6.6
          body: |
            ## 荣耀工具箱 1.6.6（荣耀搜索升平级 / 一级页面导航条沉浸收敛修）

            快服务手势改向已在 v1.6.5 真机确认生效，本版
            未动快服务、长按唤醒与掌盟；两处改动都只动
            呈现，功能、默认值、落盘键与 hook 行为不变。

            **一、荣耀搜索从资源库增强里拆出来平级**
            此前荣耀搜索的设置混在「资源库增强」子页里，
            本版拆出：系统页 → 桌面组里「资源库增强」与
            「荣耀搜索」两行并列同级，点「荣耀搜索」进
            独立子页，承载原先的净化 / 搜索范围 / 搜索引擎
            三个入口（摘要口径与原先一致）；「资源库增强」
            子页只留资源库与桌面本份的行（资源库四项 +
            桌面手势三项 + 重启作用域与状态区）。搜索三
            子页的配置仍是同一份、键名与落盘通道不变，
            已调好的开关状态不丢；子页返回落点改为搜索
            主页。

            **二、一级页面导航条沉浸：窗口底色与页面色不一致**
            三轮反馈后定位到实差：夜间主题的窗口背景是
            #121212，而页面底色（miuix 0.8.8 默认深色方案
            的 surface，经库源码核实）是纯黑——只要窗口
            有一条没被内容画到，露出的就是这块异色窗口
            底，看着就是黑带；浅色侧同理（页面 #F7F7F7
            对 Material 默认底 #FAFAFA）。本版双保险对齐：
            - 主题 XML 显式写 windowBackground：浅色
              #FFF7F7F7、深色 #FF000000，与页面 surface
              同值（色值出处：miuix v0.8.8 Colors.kt 的
              lightColorScheme / darkColorScheme，本应用
              ThemeController 未传自定义色板）；
            - MainActivity 的窗口 SideEffect 按当前生效
              深浅（软件主题设置与系统深浅合成）再把窗口
              背景设为同一 surface 色，覆盖软件内强制
              深 / 浅与系统不一致时 XML 底色对不上的情况。
            v1.6.5 的根部铺色与窗口标志（decorFits / 透明
            栏色 / 对比度强制关）保留不动；Chooser 半透明
            主题未动。

            **复验点**：① 搜索平级：系统页桌面组应见
            「资源库增强 / 荣耀搜索」两行并列；点荣耀搜索
            进独立子页，三入口与原先一致、开关状态不丢；
            资源库增强页只剩资源库与桌面手势。② 沉浸：
            深色下四栏页底部手势条区域应与页面同为一调、
            无黑带，浅色下同样无色差带。

          files: dist/*.apk
