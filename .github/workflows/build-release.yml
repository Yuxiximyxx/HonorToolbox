name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.2.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.2.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: 荣耀工具箱 1.2.1
          body: |
            ## 荣耀工具箱 1.2.1（界面保真修复）

            本版只修界面呈现：功能、设置项、默认值与生效方式
            一概不变，覆盖安装即可、配置不用重设。

            **首页按效果图落地**
            - 顶部蓝色状态大卡（模块运行状态、LSPosed 激活
              与作用域个数都是真值）、已启用功能与机型两张
              并排小卡、「重启作用域」四行收进带分割线的卡
              片，整页卡片在灰底上清晰可见（上一版浅色下白
              卡压白底、看起来像没卡片，这次一并修了）。

            **悬浮底栏换定版 Dock 配方**
            - 宽度按栏目数自适应、四栏时接近满宽，不再缩成
              中间一小条；高 68dp，强毛玻璃（栏下内容透出
              明显模糊），选中项是深色药丸底配浅色图标文字。
            - 「设置」页的悬浮/玻璃开关行为不变：关玻璃变
              实色，关悬浮变贴底栏。

            ⚠️ 从旧版升级直接覆盖安装即可，配置不用重设。

          files: dist/*.apk
