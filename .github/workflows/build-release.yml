name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.9.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.9.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: 荣耀工具箱 1.9.0
          body: |
            ## 荣耀工具箱 1.9.0（合入 LockPanel 锁屏快捷面板）

            ### 合入内容

            把 LockPanel（作者 chaosz，「Magic OS 锁屏快捷
            面板」v1.20）合进工具箱：接管锁屏底部快捷面板
            （SystemUI 的 ToolBox/Magazine 锁屏体系）——控制
            面板能否上划呼出（跟随系统 / 强制允许 / 强制
            禁止）、隐藏「换壁纸 / 开启杂志锁屏」文字、5 个
            快捷槽位的图标与点击动作替换（内置录音机 / 计
            算器 / 手电筒 / 时钟 / 扫描与相机免解锁直开，
            也可换成任意应用或指定 Activity）。

            原模块只有 APK、无公开源码，本版以反编译代码
            为唯一依据移植：全部 hook 落点与逻辑零改（仅
            两处 jadx 反编译伪影做了语义等价的最小修复，
            见源码头注），13 个配置键的键名、默认值、取值
            格式逐字不变。

            ### 配置通道（按工具箱范式适配）

            - Provider authority 改为
              io.github.yuxiximyxx.honortoolbox.lockpanel，
              数据源为工具箱镜像偏好 lockpanel_settings，
              SystemUI 侧仍经 query + ContentObserver +
              CFG_CHANGED 广播（action 改工具箱包名前缀）
              拉取与感知变化，改动即时生效、无需重启。
            - 原独立版配置**不迁移**：新子页首次打开按原
              默认值整份播种。
            - 作用域不变：宿主仍只有 com.android.systemui
              （工具箱作用域总数仍为 17 项）。

            ### 设置界面

            「系统」页新增「锁屏」分组 →「锁屏快捷面板」
            子页（MIUIX 重排，只动呈现）：总开关、面板可
            用性三档、隐藏切换样式、5 个槽位行（点进二级
            编辑：图标选择器带搜索与原厂图标目录、动作选
            择器含内置动作 / 应用列表 / 指定 Activity 输
            入）、恢复默认。原版的重启 SystemUI 按钮不另
            造，复用首页既有入口。

            ### 随带更新（小乐追加）

            - 首页「已启用功能」计数把锁屏快捷面板计入：
              计数口径 4 → 5（分母同步改 5）。
            - 「全部作用域」页新增「锁屏」分组，含
              com.android.systemui「锁屏快捷面板」一行，
              与通知中心主题、长按唤醒等 SystemUI 行并列，
              批量重启按包名去重、SystemUI 仍只重启一次。

            **复验点**：装 v1.9.0 后先停用独立版 LockPanel
            （防双重 hook）；在新子页把某个槽位动作换成计
            算器，锁屏划出面板点它验证；面板模式切「强制
            禁止」应划不出面板；首页已启用功能数在打开锁
            屏快捷面板总开关后应 +1。

          files: dist/*.apk
