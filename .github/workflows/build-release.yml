name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.8.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.8.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          name: 荣耀工具箱 1.8.2
          body: |
            ## 荣耀工具箱 1.8.2（修快服务手势改向闲置后首击失效）

            ### 定案（真机诊断日志全量分析）

            快服务改向每次手势现读配置（Provider →
            Settings.Global → 文件，无缓存）。失效样本
            全部是「HIT gesture but config unreadable
            (source=none) -> PASS」，且都落在快服务进程
            刚重启的首次手势上：新进程首击时工具箱
            Provider 进程冷启动未就绪，Global 从未写
            成功、文件通道快服务又无读权限，三路皆空
            直接放行进了快服务；同一进程约 10 秒后的
            手势无任何人为干预即自愈。体感上的「闲置
            一段时间后第一次用就进快服务、重启快服务
            后正常」正是进程被系统回收后新进程首击
            中招。

            ### 修法（hook 侧三层兜底，只动 quickgesture）

            1. **最后成功配置缓存**：进程内缓存最后一
               次成功读到的配置，任一通道读成功即刷新；
               三路皆空时先用缓存判定（diag 来源记
               cache），不再直接放行。缓存只存进程内，
               进程重启即清。
            2. **首次失败延迟重试**：三路皆空且缓存也
               空时，放行前同步延迟约 400ms 重读一次
               Provider（来源记 provider(retry)），给
               Provider 进程冷启动留时间；仍失败才
               放行。总阻塞半秒级封顶。
            3. **安装后种子读**：安装完成后起后台线程，
               在约 1s、3s 各做一次带宿主 Context 的
               读取预热缓存（安装时刻宿主 Application
               未就绪、自检读恒落空的老形态由此补上），
               种子读结果与来源都记进诊断日志。

            diag 来源枚举扩展 cache / provider(retry)
            两种新值，其余文案格式不变。其它功能零改。

            **复验点**：装 v1.8.2 → 强停快服务 → 等一
            段时间（或等快服务进程自然重启）后第一次
            斜滑，应直接改向到荣耀搜索、不再先进快
            服务；连滑多次稳定。诊断日志里新进程的
            种子读应能看到 source=provider 的成功行，
            首击若仍撞冷启动，应看到 provider(retry)
            或 cache 兜底后 REDIRECT ok。

          files: dist/*.apk
