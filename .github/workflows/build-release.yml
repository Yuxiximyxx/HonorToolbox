name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.5.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.5.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: 荣耀工具箱 1.5.0
          body: |
            ## 荣耀工具箱 1.5.0（MagicXM4 合入：索尼耳机设备中心）

            **MagicXM4 合入（荣耀工具箱第二阶段第三弹）**
            - 独立模块 MagicXM4（Sony WH-1000XM4 在 MagicOS 上走
              索尼 SPP 协议接入荣耀设备中心）的全部功能搬进工具箱：
              设备中心降噪卡片、双耳/单耳电量、降噪切换、状态栏
              耳机图标、通知电量文案、控制中心降噪快捷磁贴，以及
              完整耳机详情页（电量环、降噪分段、EQ、固件信息、
              电量历史）。入口在「系统 → 耳机 → 索尼 WH-1000XM4
              设备中心」（原占位行转真入口，Free4 入口不变）。
            - 技术移植：原模块基于 libxposed 现代 API，本版把
              全部拦截点逐处转到传统 Xposed API（与工具箱其余
              功能同底座）；配置通道由 RemotePreferences 换成
              落盘现读（/sdcard/Download/HonorToolbox/magicxm4/），
              键名与默认值不变。旧 Material3 首页（PopupActivity /
              ui/App.kt）按既定拍板整删、不搬入。
            - 双耳机共存：Free4 与 XM4 同在蓝牙进程时按设备识别
              分流（Free4 走欢律名 token/productId、XM4 走索尼
              名匹配），两边电量/降噪键（magicorig_* 与
              magicxm4_*）与 SPP 通道隔离，互不串扰。
            - 数据零迁移：约 47 个 magicxm4_* Settings.Global 键
              （含单耳电量 magicxm4_battery_single、电量历史
              magicxm4_batt_history）与蓝牙进程内存储全部保名，
              旧版历史数据装上即在。仅原 RemotePreferences 里的
              小配置（伪装设备 ID、日志级别、点击动作等，多为
              默认值）不迁移、回到默认值。

            ⚠️ 装好后请：① 五个作用域与 v1.4.0 相同、无需新增
            勾选（com.android.bluetooth、com.android.systemui、
            com.hihonor.audioaccessorymanager、com.hihonor.imedia.sws、
            com.hihonor.controlcenter）；② **停用旧的独立版
            MagicXM4 模块**，避免双重 hook；③ 重启一次作用域让
            新 hook 生效。本版未经真机验证，请按需回验：XM4
            设备中心卡片出现、电量（含单耳）显示、降噪切换、
            EQ 保存、历史电量数据是否还在；**双耳机同时连接**
            时两边电量与降噪互不串扰；Free4 功能不回归。

          files: dist/*.apk
