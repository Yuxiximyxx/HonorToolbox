name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.10.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.10.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.1
          name: 荣耀工具箱 1.10.1
          body: |
            ## 荣耀工具箱 1.10.1（修快服务改向闲置后首击失效）

            ### 本版改动（只动快服务改向一条链，其余功能未动）

            现象：闲置一段时间后第一次底角斜滑又直达快
            服务本身，重启快服务后恢复——与 2026-11-23
            晚复发同形态，v1.8.2 的三层兜底在真机仍未
            拦住。

            复盘定案（对照旧日志与代码）：缺口是时序。
            快服务进程被系统频繁杀重启，手势冷启进程时
            决策点（LauncherActivity.onCreate）在进程
            启动后约 0.2~0.9s 就到达，而 v1.8.2 的种子
            预热在 +1s/+4s 才跑，决策永远跑在预热前面；
            首击重试只有固定 400ms 单枪，而 Provider
            焐热需要约 1~2s 内多次尝试。

            三处补强：

            - 预热提前：hook 宿主 Application.onCreate
              （必在 Activity.onCreate 之前、进程里第一
              个能拿到真 Context 的点）立刻多枪预热配置
              缓存（0/250/700/1500ms），原 1s/3s 种子
              读保留作补枪。
            - 决策点改有界重试环：配置三路皆空时不再
              单枪重试，在 1.6s 预算内多枪重读
              Provider（远低于 ANR 线，只在手势命中的
              冷路径触发，热路径零影响），逐枪结果与异
              常类名打进诊断日志。
            - 二审延迟决策：读空放行时记 pending，
              onResume 时复判一次（预算减半 0.8s、只
              审一次）；开关关/目标未配置这类已读到配
              置的放行不二审。

            **复验点**：装 v1.10.1 后强停快服务，放置
            一段时间（让快服务与工具箱进程都被系统回
            收），第一次底角斜滑应直接改向到已配置的
            目标（如荣耀搜索），不再先打开快服务本身；
            正常点开快服务图标仍应放行进快服务。若仍
            失效，导出 /sdcard/Download/HonorToolbox/
            quickgesture.log：本版日志含每枪 Provider
            尝试结果（provider attempt #n … ok/empty/
            error 类名）与二审行，可据此定案。

          files: dist/*.apk
