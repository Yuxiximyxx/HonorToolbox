name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.0.3-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.0.3-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: 荣耀工具箱 1.0.3
          body: |
            ## 荣耀工具箱 1.0.3（微修）

            本版只修两处，功能与设置项不变：

            **修复 1：重启弹窗在夜间模式下白底白字看不见**
            - 根因：v1.0.2 的重启弹窗（系统对话框）没跟应用的
              MIUIX 主题对齐配色——对话框恒是浅色底，里面三行
              按深色主题出浅字，浅字落浅底上完全看不见。
            - 修法：弹窗配色改为与应用主题严格一致：日间浅底
              深字、夜间深底浅字，标题、每行标题与摘要都可读。

            **补项 2：重启菜单新增「重启长按导航条唤醒」一行**
            - 长按唤醒的作用域就在系统界面进程里，它的重启
              本来就是「重启系统界面」那一项，只是原先埋在
              摘要里不好找；这次单列一行，执行仍是同一个
              动作、同一条机制。菜单现共四行：重启系统界面 /
              重启长按导航条唤醒 / 重启桌面 / 强停快服务，
              点某一行才执行，点外部或「取消」只关窗。

            ⚠️ 从旧版升级直接覆盖安装即可，配置不用重设。

          files: dist/*.apk
