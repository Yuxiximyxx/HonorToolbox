name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: 荣耀工具箱 1.6.0
          body: |
            ## 荣耀工具箱 1.6.0（掌盟净化合入：「应用」页首个功能）

            **掌盟净化 PalmPurify 合入**
            - 独立模块 PalmPurify（给掌上英雄联盟 com.tencent.qt.qtl
              做去广告、界面精简与导航条沉浸）的全部功能搬进工具箱：
              透明沉浸、屏蔽开屏广告、底栏精简、隐藏中间加号、
              首页运营模块精简、拦截推广/会员弹窗、关闭更新提醒、
              屏蔽摇一摇跳转、调试日志。设置入口在「应用 →
              掌盟净化」（「应用」页原占位换真内容），9 个开关与
              独立版一一对应，键名与默认值不变。只做展示层拦截，
              不碰战绩/资产/活动接口（原模块红线不变）。
            - 技术移植：原模块基于 libxposed 现代 API + DexKit
              点位定位，本版把全部拦截点逐处转到传统 Xposed API
              （与工具箱其余功能同底座，DexKit 保留）；配置通道
              由 RemotePreferences 换成落盘现读
              （/sdcard/Download/HonorToolbox/palmpurify/）。
              旧配置自动迁移：独立版里改过的开关（远程组与本地
              兜底带显式标记的用户值）由 hook 导出、打开掌盟
              设置子页时导入一次，读不到静默按默认、不崩。

            **本版追加增强（单独标注）：底栏显示自定义**
            - 原单一「底栏精简」改为总闸 + 逐项开关：设置子页
              按 hook 在掌盟里实际命中的底栏项逐项列名，自己
              勾选留哪些、藏哪些；逐项缺省与原精简结果一致
              （首页/我的显示、其余隐藏），升级观感不突变。
            - 均匀分布沿用掌盟底栏宿主自己的机制：底栏行是
              LinearLayout，显示项一律等权（weight=1）瓜分整行
              宽度、隐藏项 GONE 不占位——藏掉任意几项，剩下的
              自动等距铺满；只剩一项时占满整行。

            ⚠️ 装好后请：① 在 LSPosed 作用域里**新增勾选
            com.tencent.qt.qtl（掌上英雄联盟）**；② **停用旧的
            独立版 PalmPurify 模块**，避免双重 hook；③ 重启一次
            掌盟作用域让新 hook 生效。本版未经真机验证，请按需
            回验：冷启无开屏广告、底栏精简生效、无中间加号、
            首页运营模块消失但战绩/资产/活动入口都在、推广
            弹窗被拦截、更新弹窗关闭、摇一摇不跳转、导航条
            沉浸且底部 tab 不被手势条遮挡、独立版改过的旧
            配置是否带过来；**底栏逐项任意勾选组合下剩余项
            均匀分布、藏到只剩一项时不崩**。

          files: dist/*.apk
