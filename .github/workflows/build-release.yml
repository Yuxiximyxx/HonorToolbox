name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.10.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.10.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.0
          name: 荣耀工具箱 1.10.0
          body: |
            ## 荣耀工具箱 1.10.0（应用底栏归 LiquidTab 统一接管）

            ### 本版改动

            按定案把「应用」部分涉及应用自有底栏的功能全部
            去除：掌盟与小黑盒的底栏今后由 LiquidTab 模块
            统一控制，本模块不再触碰这两个应用的底栏。

            ### 掌盟净化

            - 删除「底栏显示」整组设置：底栏精简总闸
              （slim_tabbar）、逐项显示开关（tab_show_*）、
              隐藏中间加号（hide_center_btn）。
            - hook 侧同步停止：首页处理不再套用底栏逐项
              显隐与等权铺满、不再隐藏中间加号、不再记录
              底栏项名单；旧配置迁移也不再导入这两个键
              （存量键值留在 prefs 里无害、不再被读取）。
            - 保留不动：透明沉浸（系统导航条沉浸、非应用
              底栏）、屏蔽开屏广告、首页运营模块精简、
              弹窗拦截、摇一摇拦截、调试日志。

            ### 小黑盒增强

            - 删除「液态玻璃」与「底部导航栏」两组设置：
              工具箱子页与小黑盒软件内面板（两处共用同一
              份设置定义）同步消失。
            - hook 侧整套停止安装：液态玻璃底栏
              （LiquidGlassBottomBarHook 与 liquidglass
              整包实现）、底部导航隐藏（BottomTabHook）、
              禁止底栏热更新（BottomTabUpdateHook）全部
              移除，配置键（liquid_glass / glass_* /
              hide_tab_* / hide_add /
              block_bottom_tab_update）停止读取生效；
              配置备份与镜像同步名单同步摘除这些键。
            - 保留不动：广告过滤、发帖过滤、首页信息流、
              评论过滤、搜索页精简、帖子详情精简、游戏库
              精简、分享净化、收藏、复制、视频下载、截图、
              每日任务、动态推送、通用等全部其他功能；
              全界面系统导航条沉浸保留（改为常开、不再
              依赖已删的 glass_immersive 键）。

            ### 其他

            - 输入法玻璃（wetypeglass）与工具箱自身悬浮
              底栏不受影响；启用功能计数与全部作用域页
              不变（掌盟/小黑盒功能本体都还在，作用域
              总数仍 17 项）。
            - 随带清理：去掉只服务于小黑盒玻璃底栏的
              外部玻璃库依赖（com.github.QWEA0:
              liquidglass）。

            **复验点**：装 v1.10.0 后，掌盟净化子页应只剩
            界面/开屏/首页/弹窗/其他五组、小黑盒增强子页
            与小黑盒软件内面板应不再出现「液态玻璃」与
            「底部导航栏」；两个应用的底栏外观改在
            LiquidTab 里控制（需 LiquidTab 的掌盟/小黑盒
            适配版）。

          files: dist/*.apk
