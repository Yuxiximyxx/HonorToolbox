name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.10.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.10.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.2
          name: 荣耀工具箱 1.10.2
          body: |
            ## 荣耀工具箱 1.10.2（修 MagicPods 串扰其他耳机）

            ### 本版改动（只动 MagicPods 身份门控，其余功能未动）

            现象（真机实证）：AirPods、HUAWEI FreeBuds 5 连手机时，
            设备中心展开卡片的噪声控制点了不起作用（更多设置里
            可以），通知栏耳机通知标题还被误写成「OPPO Enco
            Free4」；停用工具箱后全部恢复。

            根因：MagicPods 的身份判定有个 Free4 兜底——当前机型
            没被正向识别时默认当 Free4，这个显示兜底被拦截路径
            共用了：SmartConnect 查询与设备信息合成对任意设备
            无条件答成功、卡片降噪下发桥无条件拦截别家设备的
            点击、通知占位文案无条件换成 Free4 名。非欢律耳机
            就这样被当成 Free4 接管。

            修法：拦截类路径一律加正向识别门控——

            - PodIdentity 新增 identified()：只有机型已被正向
              识别发布才返回，未识别返回 null；current() 的
              Free4 兜底只保留给纯显示。
            - 设备中心 SmartConnect / getDeviceInfo 合成：带
              MAC 的只在我方 MAC 时合成，无参的只在正向识别
              命中时合成，其余放行原逻辑。
            - 卡片降噪下发（setNoiseCtrlMode）：只处理我方
              MAC 的点击，别家设备放行原 MBB 调用；模式集
              注入（fromBatteryData）未识别时不注入。
            - SystemUI 通知占位换名：正向识别命中且我方耳机
              当前在连才换名，未命中留系统原文案。

            Free4 被正向识别时，球位 / 卡片 / 电量 / 降噪 / EQ
            等既有行为不变；欢律协议层零改动。

            **复验点**：装 v1.10.2 后重新启用工具箱，分别连
            AirPods、FreeBuds 5：设备中心展开卡片应能直接切
            降噪模式，通知栏耳机通知标题应是设备本名；再连
            Free4，设备中心球位、卡片、电量与降噪应与此前
            一致。

          files: dist/*.apk
