name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.7.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.7.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: 荣耀工具箱 1.7.1
          body: |
            ## 荣耀工具箱 1.7.1（热修：小黑盒启动即崩）

            v1.7.0 合入的小黑盒增强在真机上会让小黑盒一
            打开就死：BetterHeybox 适配层的 proceed（执行
            原方法）用的是普通反射调用，被 hook 的方法经
            反射会再次进入拦截、拦截体里再 proceed 又反射
            调用，无限递归栈溢出，进程在第一个被 hook 的
            Application.onCreate 上就当场死亡（LSPosed
            日志实证：只打出一行安装日志便无后续、进程
            反复重启）。独立版没事是因为原框架的 proceed
            走原方法直通通道。

            本版把适配层 proceed 改走 XposedBridge 的
            原方法直通通道（invokeOriginalMethod，绕开
            hook 分发），并通读排查了适配层与合入树：其余
            反射调用都是普通数据对象/工具方法调用、不带
            proceed 语义，无同类问题。除此一处外与
            v1.7.0 完全一致，其它功能未动。

            **复验点**：装本版后 LSPosed 里确认工具箱对
            小黑盒（com.max.xiaoheihe）作用域勾着（独立版
            BetterHeybox 保持停用），强停并重开小黑盒：
            应正常打开、小黑盒增强各项功能生效。若仍打
            不开，再导一份 LSPosed 日志即可定位死点。

          files: dist/*.apk
