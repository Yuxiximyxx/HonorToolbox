name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.6.5-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.6.5-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.5
          name: 荣耀工具箱 1.6.5
          body: |
            ## 荣耀工具箱 1.6.5（快服务改向换 Provider 通道 / 一级页面导航条沉浸补根）

            长按唤醒在 v1.6.4 已真机确认修好，本版未动
            NavWake；掌盟与其它功能一律未动。

            **一、快服务手势改向：Settings.Global 写不进去，换 ContentProvider 通道**
            v1.6.4 加的 Settings.Global 通道真机仍不生效：
            工具箱没有 WRITE_SETTINGS、也从未被授予「修改
            系统设置」，设置侧 putString 必然失败（只在日志
            里留痕、设置页无感），hook 回退到文件通道、而
            快服务进程没有直读 Download 的权限，照旧放行。
            本版新增一条不需要任何特殊权限的跨进程通道：
            - 工具箱新增 exported 的 ContentProvider
              （authority io.github.yuxiximyxx.honortoolbox.quickgesture，
              与资源库增强的 Provider 同范式 call("get")）：
              在工具箱进程内读与设置页同源的镜像偏好、供出
              当前配置文本，页面显示什么 hook 就读到什么；
            - hook 侧读序改为 Provider → Settings.Global
              （保留）→ 文件候选扫描（兜底），判定逻辑零
              改动；查询只在安装自检与手势命中时发生，异常
              一律回退、绝不阻塞手势判定；
            - 安装行与命中行日志的来源扩展为
              provider/global/file/none；
            - 改向设置页新增一行通道状态：最近一次保存的
              文件 / 系统设置项同步结果，页面上直接可见。

            **二、一级页面导航条不沉浸：根部没人画最底下那条**
            二级界面（耳机详情等独立 Activity）已沉浸、
            一级四栏页仍有黑带：窗口设置两边一致，差别在
            绘制——详情页根部把主题 surface 画满整个窗口，
            而四栏页的窗口背景是透明的（主题口径不动），
            内容与采样层都没画到屏幕物理底边，Dock 以下
            露的是透明窗口背后的黑场。本版让 MainActivity
            宿主最外层与详情页同款：先铺一层 fillMaxSize
            的主题 surface 画满整个窗口（含导航条区域）、
            再叠内容与悬浮 Dock；铺色层在采样层之下，玻璃
            采样与 Dock 的位置/尺寸/手势逻辑一律不动。

            **复验点**：① 快服务改向：打开改向设置页确认
            配置在（页面底部有「配置已保存」通道状态行）→
            强停快服务 → 底角斜滑应直达荣耀搜索主页；
            LSPosed 日志里快服务安装行/命中行应带
            source=provider；② 沉浸：四栏页（首页/系统/
            应用/设置）底部手势条区域应与页面同色、不再
            黑带，子页不回归。

          files: dist/*.apk
