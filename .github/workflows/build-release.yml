name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.7.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.7.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: 荣耀工具箱 1.7.0
          body: |
            ## 荣耀工具箱 1.7.0（BetterHeybox 合入：小黑盒增强 + 工具箱内设置界面）

            原独立模块 BetterHeybox（小乐的 fork，v0.10.2）
            整体合入工具箱，成为「应用」页继掌盟净化之后
            的第二个第三方应用增强。原仓库不动；装本版后
            请停用旧的独立版 BetterHeybox，避免双重 hook。

            **合入方式（与掌盟同范式）**
            - 原模块基于 YukiHookAPI（libxposed 运行时）的
              声明式 hook 全部经一层传统 Xposed API 适配层
              落地：hook 点、判定与拦截语义逐条保留，40 余
              组功能（广告过滤、发帖/评论过滤、液态玻璃
              底栏、底栏隐藏、单列信息流、解除复制、视频
              下载、截图、每日/我的任务、动态推送等）都在；
            - 配置走 v1.6.5 已真机验通的 ContentProvider
              直供：工具箱设置页写镜像、hook 在小黑盒进程
              里现读；旧独立版的设置原本就存在小黑盒本地，
              镜像没有的键回退读它——旧配置不丢、不用搬；
            - 作用域新增 com.max.xiaoheihe（小黑盒），首页
              「全部作用域」的「应用增强」组里新增小黑盒
              一行，可勾选强停重启生效。

            **工具箱内设置界面（本版点名新增）**
            原模块的设置入口只在小黑盒软件内。本版在
            「应用」页 →「应用增强」→「小黑盒增强」加了
            独立子页，把原内嵌面板的全部持久化设置项按
            同样分组摆齐（广告过滤 / 发帖过滤 / 首页信息
            流 / 评论过滤 / 搜索页精简 / 帖子详情精简 /
            游戏库精简 / 分享净化 / 收藏管理 / 液态玻璃 /
            底部导航栏 / 消息红点 / 实验性功能 / 解除
            复制 / 评论交互 / 网页 / 视频下载 / 截图
            功能 / 图片缓存 / 每日任务 / 我的任务 /
            动态推送 / 通用），键名、默认值、语义与原
            模块一致；小黑盒内的设置面板保留，两处改动
            经同一份镜像互通。只在软件内面板保留的：
            测试 AI 连接、动态推送的立即检查/测试推送/
            导入关注、游戏库与消息入口勾选器、评论长按
            面板按钮管理、视频保存位置选择、配置与日志
            的导入导出、各诊断行（都依赖小黑盒运行时）。

            **与独立版的已知差异**
            - 「重载模块」（热重载）是 libxposed 能力，
              传统框架下以强停并重开小黑盒代替；
            - 原模块的防降级版本下限判定在合入形态下
              停用（工具箱有自己的版本线）；
            - 液态玻璃的外部玻璃库与原 fork 同一提交钉版
              引入，玻璃提供方仍可选 hbmod 模块。

            **复验点**：LSPosed 作用域勾上小黑盒并强停
            重开后：① 开屏/信息流广告按开关被屏蔽；
            ② 液态玻璃底栏出现、隐藏底栏项重启后生效；
            ③ 工具箱子页改任意开关，小黑盒内面板打开
            应显示同一值（反之亦然）；④ 每日任务/动态
            推送按配置工作；⑤ 首页全部作用域页「应用
            增强」组可见小黑盒行、可勾选重启。

          files: dist/*.apk
