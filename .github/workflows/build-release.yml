name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.4.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.4.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: 荣耀工具箱 1.4.0
          body: |
            ## 荣耀工具箱 1.4.0（MagicPods 合入：OPPO 耳机设备中心）

            **MagicPods 合入（荣耀工具箱第二阶段第二弹）**
            - 独立模块 MagicPods（OPPO Enco Free4 / Enco Air4 Pro
              在 MagicOS 上走欢律协议接入荣耀设备中心）的全部功能
              搬进工具箱：设备中心降噪卡片、双耳/充电仓电量、
              降噪切换、状态栏耳机图标、通知电量文案、控制中心
              降噪快捷磁贴，以及完整耳机详情页（电量环、降噪
              分段、EQ、手势、固件信息、电量历史）。入口在
              「系统 → 耳机 → OPPO Enco Free4 设备中心」。
            - 技术移植：原模块基于 libxposed 现代 API，本版把
              全部拦截点逐处转到传统 Xposed API（与工具箱其余
              功能同底座、同一入口分发）；配置通道由
              RemotePreferences 换成落盘现读
              （/sdcard/Download/HonorToolbox/magicpods/），
              键名与默认值不变。
            - 数据零迁移：约 37 个 magicorig_* Settings.Global
              键（电量/电量历史/EQ/手势/固件/降噪状态）与蓝牙
              进程内 magicorig_device / magicorig_battery 存储
              全部保名，旧版的历史电量等数据装上即在。
              仅原 RemotePreferences 里的小配置（伪装设备 ID、
              日志级别、点击动作等，多为默认值）不迁移、回到
              默认值，不影响耳机功能与历史数据。

            ⚠️ 装好后请：① 在 LSPosed 里给工具箱新勾五个作用
            域：com.android.bluetooth、com.hihonor.audioaccessorymanager、
            com.hihonor.imedia.sws、com.hihonor.controlcenter
            （com.android.systemui 原本已勾）；② **停用旧的独立
            版 MagicPods 模块**，避免双重 hook；③ 重启一次作用
            域让新 hook 生效。本版未经真机验证，请按需回验：
            设备中心卡片出现、电量显示、降噪切换、详情页各项、
            EQ 与手势保存、历史电量数据是否还在。

          files: dist/*.apk
