name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.3.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.3.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: 荣耀工具箱 1.3.0
          body: |
            ## 荣耀工具箱 1.3.0（底栏药丸可拖动 + 资源库增强合入）

            **底栏药丸拖动补齐（移植自泥坛 LumaGA 的 FloatingTabDock）**
            - v1.2.3 只搬了静态玻璃配方，这版把拖动系统补回来：
              按住药丸横拖跟手（目录弹簧组：value ζ1.0/k1000、
              press ζ1.0/k1000、scaleX ζ0.6/k250、scaleY
              ζ0.7/k250、velocity ζ0.5/k300），松手吸附最近
              一栏并切页；普通点按是零位移拖动、走同一条路径，
              切页不回归。按压时药丸透镜放大（折射 10/14 ×
              按压进度），胶囊带 4dp 橡皮筋平移与 +5% 绽放。
            - LIQUID 玻璃全表与 v1.2.3 一字未动，药丸静止观感
              不变。取舍：工具箱四栏标签常显，泥坛的
              tabsBackdrop 强调色副本会与常显字形重影，故未
              搬——药丸只采样页面内容做透镜，可见字形画在药
              丸之上、永远清晰；代价是按压时字形本身不变形。

            **资源库增强（LibraryPlus）合入**
            - 独立模块 LibraryPlus 的全部功能搬进工具箱：隐藏
              应用、文件夹改名、新建分类、自定义分类、最后一
              页左滑打开资源库、上滑打开荣耀搜索、从右侧滑入
              动画、荣耀搜索净化 / 搜索范围 / 搜索引擎、重启
              作用域与生效状态。入口在「系统 → 桌面 → 资源库
              增强」，功能、默认值、落盘语义与独立版一致。
            - 共存处理：signature 权限名与 Provider authority
              已随工具箱包名改名（见下），状态回传保留
              Provider 通道；旧版 LibraryPlus 的配置会在打开
              资源库设置页时按时间戳自动迁移过来（读不到就用
              默认值，不影响使用）。

            ⚠️ 装好后请：① 在 LSPosed 里给工具箱作用域确认勾
            上资源库（com.hihonor.hiboard）与荣耀搜索
            （com.hihonor.search）（桌面原本已勾）；② 停用旧
            的独立版 LibraryPlus 模块，避免双重 hook；③ 重启
            一次作用域让新 hook 生效。

          files: dist/*.apk
