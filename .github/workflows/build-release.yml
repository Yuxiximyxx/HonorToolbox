name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.7.4-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.7.4-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.4
          name: 荣耀工具箱 1.7.4
          body: |
            ## 荣耀工具箱 1.7.4（关于页名单补全 / 去小黑盒版本警告弹窗 / 小黑盒首屏底栏沉浸）

            ### 一、关于页来源名单更新

            设置 → 关于的「来源」卡文案还停在第一
            阶段：MagicPods / MagicXM4 / LibraryPlus
            写着「下一阶段合入」，且完全没提后来合
            入的 PalmPurify 与 BetterHeybox。本版改
            为与现状一致的完整名单（九项逐行列出）：
            HonorShadeClock——通知中心主题 /
            QuickGesture——快服务手势改向 /
            NavWake——长按导航条唤醒 /
            NightIcon——图标日夜切换 /
            LibraryPlus——资源库增强 /
            MagicPods——OPPO Enco Free4 设备中心 /
            MagicXM4——索尼 WH-1000XM4 设备中心 /
            PalmPurify——掌盟净化 /
            BetterHeybox——小黑盒增强。「下一阶段
            合入」字样删除，排版与「原仓库保持不
            变」措辞不变。

            ### 二、去掉小黑盒的版本警告弹窗

            小黑盒版本已漂移到 1.3.402（模块标注支
            持到 1.3.400），每次进入都会弹「Better-
            Heybox 支持 Heybox 1.3.396 / … /
            1.3.400，当前检测到 1.3.402」的悬浮提
            示框。本版把这条提示的 UI 呈现（宿主底
            部提示/Toast 兜底）整段去掉；版本检测
            本身与模块日志里的同一行记录保留不动，
            版本检测 Hook 的安装与防降级逻辑不受
            影响。

            ### 三、小黑盒首次进入底栏不沉浸

            现象：冷启动第一次进入小黑盒时底部导航
            条不沉浸（有实色带），切换到其它页面后
            才变沉浸。机制：全界面沉浸 Hook 原来只
            在 Activity 的 onResume 与 onWindow-
            FocusChanged(true) 两个点即时应用沉浸
            标志；冷启动首个窗口应用后，宿主自己的
            首帧初始化（底栏/皮肤等）又把窗口标志
            覆写回去，切页时重新应用才保持住。本版
            改为多点幂等补设：除原有两个即时应用点
            外，再在 decorView attach 时、下一帧、
            以及 350ms 后各补设一次同一套沉浸标志
            （与掌盟沉浸控制器的多点重设做法对
            齐）；沉浸应用本身幂等（原始窗口状态只
            在首次捕获），重复补设无副作用。后续页
            面原有行为不变，图片查看 Dialog 沉浸等
            其它 fork 定制未动。

            **复验点**：① 关于页名单完整、无「下
            一阶段合入」字样；② 冷启动进小黑盒不
            再弹版本警告；③ 冷启动首屏底栏即沉
            浸、不需切页。

          files: dist/*.apk
