name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.2.3-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.2.3-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: 荣耀工具箱 1.2.3
          body: |
            ## 荣耀工具箱 1.2.3（底栏玻璃对齐泥坛 + 全应用沉浸 + 激活检测免勾自身）

            功能、设置项、默认值与生效方式一概不变，覆盖
            安装即可、配置不用重设。

            **底栏玻璃换泥坛 LIQUID（液态）档 + 对齐边缘**
            - 1.2.2 的磨砂档在真机上没有玻璃感（折射、通
              透、模糊、色散都看不见）：磨砂档本就是三档
              里最弱的，叠纱又厚。这版换成泥坛 GlassSpec
              的 LIQUID 档整表：叠纱 α0.32、饱和 1.5、模
              糊 8dp、透镜 24/24 带色散、高光 0.85；外壳
              边缘换泥坛同款 aligned surround（双峰边缘
              + 八层光晕 + 定色投影）。
            - 录制层按泥坛定式先铺页面背景，采样纹理处
              处不透明，不会再被压成熏黑胶囊。
            - 几何改泥坛公式：72dp 槽宽 + 6dp 内边距、
              封顶 380dp、高 68dp、栏底间隙 10dp；选中
              药丸改 LIQUID 档的近黑薄膜，不再夜间反转
              成大白椭圆。

            **全应用沉浸**
            - 状态栏与系统导航条全透明，内容铺到屏幕物
              理底边，底栏浮在内容之上、栏下采样的是真
              内容，屏幕底边不再有实色黑带。四个功能子
              页、关于页、选应用页同样处理。

            **激活检测不再依赖勾自身作用域**
            - 任一宿主进程的 hook 加载时往 Download/
              HonorToolbox/activation_status.txt 写状态
              文件，首页大卡改双信号判定：没勾工具箱自
              己也不会再误报未激活；文件版本落后时显示
              「已激活 · 旧版运行中」的中间态。

            ⚠️ 装好后请重启一次作用域（强停各宿主，或用
            首页的重启入口）：现在宿主里跑的还是旧版
            hook、不会写状态文件，重启后新文件才会被写
            出来。这是最后一次需要做这个动作——以后升
            级即使没重启作用域，大卡也会如实显示旧版运
            行中，不再误报未激活。

          files: dist/*.apk
