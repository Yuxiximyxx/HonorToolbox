name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.7.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.7.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: 荣耀工具箱 1.7.2
          body: |
            ## 荣耀工具箱 1.7.2（热修二：点帖子黑屏）

            v1.7.1 修好了小黑盒启动即崩，但点开帖子仍
            黑屏：小黑盒详细日志抓到完整堆栈——适配层
            proceed 的构造器分支还留着普通反射
            newInstance，而被 hook 的构造器经反射实例化
            同样会再次进入 hook 分发、无限递归栈溢出。
            中招的是 HttpBridge 抓 HTTP 的构造器 hook：
            平时不触发，点开帖子加载数据、目标类被实例
            化时才引爆，后台线程栈溢出、帖子数据永远回
            不来，表现为黑屏。

            本版把构造器分支也改走 XposedBridge 的原
            方法直通通道（invokeOriginalMethod 对构造
            器即直通原构造、返回值即新实例），并再扫了
            一遍合入树：全树被 hook 的构造器只有三处注
            册点、proceed 全经此通道；其余拦截体内的反
            射实例化（图片 schema、LinearLayoutManager、
            FormBody.Builder）都不是 hook 目标，不进分
            发、无同类问题。除此一处外与 v1.7.1 完全
            一致，其它功能未动。

            **复验点**：装本版后强停并重开小黑盒，点开
            帖子应正常加载出内容；小黑盒详细日志里不应
            再出现 StackOverflowError。

          files: dist/*.apk
