name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HONORTOOLBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "HONORTOOLBOX_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honortoolbox.jks"
          ls -lh "$RUNNER_TEMP/honortoolbox.jks"

      - name: Build release
        env:
          HONORTOOLBOX_KEYSTORE_FILE: ${{ runner.temp }}/honortoolbox.jks
          HONORTOOLBOX_STORE_PASSWORD: ${{ secrets.HONORTOOLBOX_STORE_PASSWORD }}
          HONORTOOLBOX_KEY_ALIAS: ${{ secrets.HONORTOOLBOX_KEY_ALIAS }}
          HONORTOOLBOX_KEY_PASSWORD: ${{ secrets.HONORTOOLBOX_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorToolbox-1.1.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorToolbox-1.1.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: honortoolbox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: 荣耀工具箱 1.1.0
          body: |
            ## 荣耀工具箱 1.1.0（界面重排）

            本版只动设置应用的排版，功能、设置项、默认值与生效
            方式一概不变，覆盖安装即可、配置不用重设。

            **单 Activity 四栏 + 悬浮胶囊底栏**
            - 原先首页与四个功能设置页、关于页共六个独立页面，
              这次收成一个界面：底部一条悬浮胶囊导航栏（毛玻璃、
              选中项药丸高亮），四栏为「首页 / 手势与唤醒 /
              通知中心 / 桌面」。
            - 首页还是原来的总索引（各功能总开关、右上角重启
              入口、底部关于入口都在）；「手势与唤醒」栏里是
              快服务手势改向与长按导航条唤醒两页；「通知中心」
              栏是主题设置整页（内部二级页不变）；「桌面」栏
              是图标日夜切换整页（选主题文件流程不变）。

            **重启菜单回归 MIUIX 底部弹窗**
            - v1.0.1 那次一点就闪退的根子（系统弹层组件缺一个
              宿主接口）这次从依赖层彻底拆掉，首页右上角的
              「重启作用域」菜单回到从底部滑出的 MIUIX 弹窗，
              四行齐全（重启系统界面 / 重启长按导航条唤醒 /
              重启桌面 / 强停快服务），日夜模式都可读，点某一
              行才执行、点外部只关窗。

            ⚠️ 从旧版升级直接覆盖安装即可，配置不用重设。

          files: dist/*.apk
